name: Go

on: [push, pull_request]

permissions:
  contents: read

env:
  CGO_ENABLED: "1"

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go 1.27.0
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.0
          cache: true

      - name: Install OpenCV on macOS
        if: runner.os == 'macOS'
        run: |
          brew install opencv@4 pkg-config
          opencv_prefix=$(brew --prefix opencv@4)
          echo "PKG_CONFIG_PATH=$opencv_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Verify OpenCV on macOS
        if: runner.os == 'macOS'
        run: |
          pkg-config --modversion opencv4
          pkg-config --cflags --libs opencv4

      - name: Configure MinGW on Windows
        if: runner.os == 'Windows'
        id: mingw
        shell: pwsh
        run: |
          $mingw = 'C:\mingw64\bin'
          $version = & "$mingw\g++.exe" -dumpfullversion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $mingw | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=$mingw\gcc.exe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=$mingw\g++.exe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache OpenCV on Windows
        if: runner.os == 'Windows'
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: 'C:\opencv\build\install'
          key: opencv-4.13.0-windows-2022-mingw-${{ runner.arch }}-${{ steps.mingw.outputs.version }}-v2

      - name: Download OpenCV sources and build script on Windows
        if: runner.os == 'Windows' && steps.cache-opencv.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test/tmp | Out-Null
          $baseUrl = 'https://raw.githubusercontent.com/hybridgroup/gocv/274ac8a2d6fc025a9dd566ae10b7a54644582c40'
          Invoke-WebRequest "$baseUrl/win_build_opencv.cmd" -OutFile test/tmp/win_build_opencv.cmd
          foreach ($project in @('opencv', 'opencv_contrib')) {
            $archive = "test/tmp/$project.zip"
            Invoke-WebRequest "https://github.com/opencv/$project/archive/4.13.0.zip" -OutFile $archive
            Expand-Archive -Path $archive -DestinationPath C:\opencv
          }

      - name: Build OpenCV on Windows
        if: runner.os == 'Windows' && steps.cache-opencv.outputs.cache-hit != 'true'
        shell: cmd
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: call .\test\tmp\win_build_opencv.cmd || exit /b 1

      - name: Add OpenCV to PATH on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'C:\opencv\build\install\x64\mingw\bin' | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify OpenCV on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = & opencv_version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -ne '4.13.0') { throw "Unexpected OpenCV version: $version" }

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v .

      - name: Test
        run: go test -v .

  test-ubuntu:
    name: ubuntu-24.04
    runs-on: ubuntu-24.04
    container: ghcr.io/hybridgroup/opencv:4.13.0-ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go 1.27.0
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.0
          cache: true

      - name: Verify Ubuntu and OpenCV
        run: |
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          pkg-config --exact-version=4.13.0 opencv4
          version=$(opencv_version)
          test "$version" = 4.13.0

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v .

      - name: Test
        run: go test -v .
